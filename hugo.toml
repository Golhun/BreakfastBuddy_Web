
baseURL = "http://localhost:1313/"
title = "Breakfast Buddy"
disableKinds = ["taxonomy", "term"]

[languages.en]
  locale = "en-GH"

[params]
  tagline = "Good Food • Brighter Days"

[build.buildStats]
  enable = true

[[build.cachebusters]]
  source = 'assets/notwatching/hugo_stats\.json'
  target = 'css'

[module]

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  disableWatch = true
  source = "hugo_stats.json"
  target = "assets/notwatching/hugo_stats.json"

[security.exec]
  allow = [
    '^(dart-)?sass$',
    '^go$',
    '^git$',
    '^node$',
    '^postcss$',
    '^tailwindcss$'
  ]
